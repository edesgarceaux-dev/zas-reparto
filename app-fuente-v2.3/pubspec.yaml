name: zas_reparto
description: "App de reparto ZAS - gestion y asignacion de pedidos."
publish_to: 'none'

version: 2.3.0+8

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.0
  local_auth: ^2.3.0
  shared_preferences: ^2.3.0
  geolocator: ^13.0.0
  image_picker: ^1.1.0
  mobile_scanner: 5.2.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icono.png"
  adaptive_icon_background: "#E85D04"
  adaptive_icon_foreground: "assets/icono_fg.png"

flutter:
  uses-material-design: true
